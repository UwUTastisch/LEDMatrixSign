; PlatformIO Project Configuration File
;
; Storage priority: SD card (if present + contains config.json) → LittleFS fallback.
; Flash the LittleFS image (used when no SD card is inserted) with:
;   pio run --target uploadfs
;
; https://docs.platformio.org/page/projectconf.html

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
framework = arduino
board_build.filesystem = littlefs
monitor_speed = 115200

lib_deps =
    bblanchon/ArduinoJson
    ESP32Async/AsyncTCP
    ESP32Async/ESPAsyncWebServer
    densaugeo/base64

[env:esp32-c3-devkitm-1]
board = esp32-c3-devkitm-1
board_build.f_cpu = 160000000L

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -D DEBUG_MATRIX=0
    -D SD_CS=4
    -D SD_MOSI=3
    -D SD_SCK=2
    -D SD_MISO=1

[env:esp32dev]
board = esp32dev
board_build.f_cpu = 240000000L

build_flags = 
 -D DEBUG_MATRIX=0
 -D SD_CS=22
 -D SD_MOSI=23
 -D SD_SCK=18
 -D SD_MISO=19

[env:esp32-s3-devkitm-1]
board = esp32-s3-devkitm-1

board_build.mcu = esp32s3

board_build.f_cpu = 240000000L

build_flags = 
 -D DEBUG_MATRIX=0
 -D SD_CS=22
 -D SD_MOSI=23
 -D SD_SCK=18
 -D SD_MISO=19

[env:esp32-s3-matrix]
board = esp32-s3-devkitm-1

board_build.mcu = esp32s3

board_build.f_cpu = 240000000L

build_flags =
 -DARDUINO_USB_CDC_ON_BOOT=1
 -DARDUINO_USB_MODE=1
# -DBOARD_HAS_PSRAM
 -D DEBUG_MATRIX=0
 -D SD_CS=22
 -D SD_MOSI=23
 -D SD_SCK=18
 -D SD_MISO=19

board_upload.flash_size = 4MB
board_build.partitions = partitions/4mb-esp-s3.csv

[env:esp32-c6]
board = esp32-c6-devkitm-1
board_build.f_cpu = 160000000L

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
#    -DARDUINO_USB_MODE=1
    -D DEBUG_MATRIX=1
    -D SD_CS=1
    -D SD_MOSI=0
    -D SD_SCK=7
    -D SD_MISO=6