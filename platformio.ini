    bblanchon/ArduinoJson
    ESP32Async/AsyncTCP
    ESP32Async/ESPAsyncWebServer
    densaugeo/base64
    greiman/SdFat
    adafruit/Adafruit NeoPixel@^1.12.5
    bitbank2/PNGdec@^1.1.3


monitor_speed = 115200

build_flags = 
 -D DEBUG_MATRIX=0
 -D SD_CS=22
